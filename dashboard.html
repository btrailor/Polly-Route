<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polly Router — Metrics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.875rem; }
    #status { font-size: 0.875rem; color: var(--muted); }
    main {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .card h3 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      color: var(--accent);
    }
    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .metric-value.null { color: var(--muted); }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .summary .card {
      text-align: center;
      padding: 1rem;
    }
    .summary .card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .summary .card .value { font-size: 1.75rem; font-weight: 700; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    th, td {
      padding: 0.5rem;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--bad);
      color: var(--bad);
      padding: 1rem;
      border-radius: 0.5rem;
    }
    canvas { max-height: 220px; }
    .refresh-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .refresh-btn:hover { border-color: var(--accent); }
    .health-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .health-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .health-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
    }
    .health-dot.good { background: var(--good); box-shadow: 0 0 8px var(--good); }
    .health-dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .health-dot.bad  { background: var(--bad);  box-shadow: 0 0 8px var(--bad); }
    .health-info { flex: 1; }
    .health-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .health-value { font-size: 1rem; font-weight: 600; }
    .signals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .signal-card {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid var(--bad);
      border-radius: 0.75rem;
      padding: 1rem;
    }
    .signal-card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.25rem; }
    .signal-card .value { font-size: 1.75rem; font-weight: 700; color: var(--bad); }
    .signal-card .sub  { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    .signal-card.zero { border-color: var(--border); background: var(--panel); }
    .signal-card.zero .value { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Polly Router Metrics</h1>
      <p>7-day progressive-autonomy view</p>
    </div>
    <div id="status">Loading…</div>
    <button class="refresh-btn" id="refresh" type="button">Refresh</button>
  </header>

  <main>
    <div id="error" class="error" style="display:none"></div>

    <section class="health-panel" id="health">
      <!-- filled by JS -->
    </section>

    <section class="summary" id="summary">
      <!-- filled by JS -->
    </section>

    <section class="grid" id="charts">
      <!-- filled by JS -->
    </section>

    <section class="card" style="margin-top: 2rem;">
      <h3>Negative routing signals <span style="color:var(--muted);font-weight:400;font-size:0.875rem;">(last 7 days from log tail)</span></h3>
      <div id="signals" class="signals-grid">
        <!-- filled by JS -->
      </div>
    </section>

    <section class="card" style="margin-top: 2rem;">
      <h3>Daily detail</h3>
      <div style="overflow-x:auto;">
        <table id="detail-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Requests</th>
              <th>Cloud</th>
              <th>Cloud dep.</th>
              <th>Local OK</th>
              <th>Local rate</th>
              <th>Coverage</th>
              <th>Gap</th>
              <th>Captured</th>
              <th>Capture rate</th>
              <th>Bloom lag</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const METRICS_URL = '/metrics';
    const STATUS_URL = '/status';
    const LOG_SIGNALS_URL = '/log-signals';
    const REFRESH_INTERVAL_MS = 30000;
    const CHART_CONFIG = {
      cloud_dependency_ratio: { label: 'Cloud dependency ratio', color: '#38bdf8', yMax: 1 },
      local_first_success_rate: { label: 'Local-first success rate', color: '#22c55e', yMax: 1 },
      knowledge_coverage_score: { label: 'Knowledge coverage score', color: '#a78bfa', yMax: 1 },
      coverage_gap_rate: { label: 'Coverage gap rate', color: '#f59e0b', yMax: 1 },
      capture_rate: { label: 'Capture rate', color: '#f472b6', yMax: 1 },
      bloom_lag: { label: 'Bloom lag (pending notes)', color: '#ef4444', yMax: null },
    };

    const formatDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const fmtPct = (v) => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
    const fmtNum = (v) => v == null ? '—' : v.toLocaleString();

    let charts = {};

    function createChartCard(key) {
      const cfg = CHART_CONFIG[key];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${cfg.label}</h3>
        <div class="metric-value null" id="val-${key}">—</div>
        <canvas id="chart-${key}"></canvas>
      `;
      document.getElementById('charts').appendChild(card);

      const ctx = document.getElementById(`chart-${key}`).getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: cfg.label,
            data: [],
            borderColor: cfg.color,
            backgroundColor: cfg.color + '33',
            fill: true,
            tension: 0.3,
            pointRadius: 4,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              beginAtZero: true,
              max: cfg.yMax,
              grid: { color: '#334155' },
              ticks: { color: '#94a3b8' }
            },
            x: {
              grid: { color: '#334155' },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }

    function init() {
      document.getElementById('charts').innerHTML = '';
      document.getElementById('summary').innerHTML = '';
      charts = {};
      for (const key of Object.keys(CHART_CONFIG)) {
        charts[key] = createChartCard(key);
      }
    }

    function updateSummary(latest, payload) {
      const summary = document.getElementById('summary');
      summary.innerHTML = '';

      const cards = [
        { label: 'Total requests', value: fmtNum(payload.days.reduce((a, d) => a + d.total_requests, 0)) },
        { label: 'Cloud dependency', value: fmtPct(latest.cloud_dependency_ratio) },
        { label: 'Local success', value: fmtPct(latest.local_first_success_rate) },
        { label: 'Knowledge coverage', value: fmtPct(latest.knowledge_coverage_score) },
        { label: 'Coverage gap', value: fmtPct(latest.coverage_gap_rate) },
        { label: 'Capture rate', value: fmtPct(latest.capture_rate) },
        { label: 'Bloom lag', value: fmtNum(latest.bloom_lag) },
      ];

      for (const c of cards) {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `<div class="label">${c.label}</div><div class="value">${c.value}</div>`;
        summary.appendChild(el);
      }
    }

    function updateCharts(days) {
      const labels = days.map(d => formatDate(d.date));
      for (const [key, chart] of Object.entries(charts)) {
        const values = days.map(d => d[key]);
        const latest = values[values.length - 1];
        const valEl = document.getElementById(`val-${key}`);
        valEl.textContent = latest == null ? '—' : (key === 'bloom_lag' ? fmtNum(latest) : fmtPct(latest));
        valEl.className = 'metric-value' + (latest == null ? ' null' : '');

        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
      }
    }

    function updateTable(days) {
      const tbody = document.querySelector('#detail-table tbody');
      tbody.innerHTML = '';
      for (const d of days) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formatDate(d.date)}</td>
          <td>${fmtNum(d.total_requests)}</td>
          <td>${fmtNum(d.cloud_requests)}</td>
          <td>${fmtPct(d.cloud_dependency_ratio)}</td>
          <td>${fmtNum(d.local_completed)}</td>
          <td>${fmtPct(d.local_first_success_rate)}</td>
          <td>${fmtPct(d.knowledge_coverage_score)}</td>
          <td>${fmtPct(d.coverage_gap_rate)}</td>
          <td>${fmtNum(d.captured_notes)}</td>
          <td>${fmtPct(d.capture_rate)}</td>
          <td>${fmtNum(d.bloom_lag)}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function updateHealth(statusPayload, logPayload) {
      const health = document.getElementById('health');
      health.innerHTML = '';

      const up = statusPayload && statusPayload.status === 'ok';
      const reliability = statusPayload?.reliability ?? {};
      const diag = statusPayload?.reliability?.diagnostics ?? {};

      // Overall router state
      let stateClass = 'bad', stateLabel = 'DOWN';
      if (up && reliability.active && diag.ok) { stateClass = 'good'; stateLabel = 'HEALTHY'; }
      else if (up) { stateClass = 'warn'; stateLabel = 'DEGRADED'; }

      const uptimeSec = statusPayload?.uptime ?? 0;
      const uptimeStr = uptimeSec < 60 ? `${Math.round(uptimeSec)}s`
        : uptimeSec < 3600 ? `${Math.round(uptimeSec / 60)}m`
        : `${Math.floor(uptimeSec / 3600)}h ${Math.round((uptimeSec % 3600) / 60)}m`;

      const cards = [
        { label: 'Router', value: stateLabel, cls: stateClass },
        { label: 'Uptime', value: uptimeStr, cls: up ? 'good' : 'bad' },
        { label: 'Reliability', value: `${reliability.enabled ? 'ON' : 'OFF'} / ${reliability.active ? 'ACTIVE' : 'INACTIVE'}`, cls: reliability.active ? 'good' : 'warn' },
        { label: 'Ollama reachable', value: diag.reachable ? 'YES' : 'NO', cls: diag.reachable ? 'good' : 'bad' },
        { label: 'Models present', value: diag.modelsPresent ? 'YES' : 'NO', cls: diag.modelsPresent ? 'good' : 'warn' },
        { label: 'Context adequate', value: diag.contextAdequate ? 'YES' : 'NO', cls: diag.contextAdequate ? 'good' : 'warn' },
        { label: 'Diagnostics', value: diag.ok ? 'OK' : 'NOT OK', cls: diag.ok ? 'good' : 'bad' },
      ];

      for (const c of cards) {
        const el = document.createElement('div');
        el.className = 'health-card';
        el.innerHTML = `
          <div class="health-dot ${c.cls}"></div>
          <div class="health-info">
            <div class="health-label">${c.label}</div>
            <div class="health-value">${c.value}</div>
          </div>
        `;
        health.appendChild(el);
      }
    }

    function updateSignals(payload) {
      const container = document.getElementById('signals');
      container.innerHTML = '';
      if (!payload || !payload.available) {
        container.innerHTML = '<div class="card" style="grid-column:1/-1"><p>Log-signal data not available.</p></div>';
        return;
      }
      const names = [
        { key: 'skip-no-credentials', label: 'Skipped provider (no credentials)' },
        { key: 'ollama-skip-size', label: 'Ollama skipped (size)' },
        { key: 'local-request-exceeds-all-endpoints', label: 'Request exceeds all local endpoints' },
        { key: 'confidence-escalation-unavailable', label: 'Confidence escalation unavailable' },
      ];
      for (const n of names) {
        const s = payload.signals[n.key] || { count: 0, last_ts: null };
        const zeroClass = s.count === 0 ? ' zero' : '';
        const el = document.createElement('div');
        el.className = 'signal-card' + zeroClass;
        el.innerHTML = `
          <div class="label">${n.label}</div>
          <div class="value">${fmtNum(s.count)}</div>
          <div class="sub">${s.last_ts ? 'last ' + new Date(s.last_ts).toLocaleString() : 'no events in tail'}</div>
        `;
        container.appendChild(el);
      }
    }

    async function load() {
      const status = document.getElementById('status');
      const error = document.getElementById('error');
      const now = new Date();
      status.textContent = 'Loading…';
      error.style.display = 'none';

      try {
        const [metricsRes, statusRes, signalsRes] = await Promise.all([
          fetch(METRICS_URL),
          fetch(STATUS_URL),
          fetch(LOG_SIGNALS_URL),
        ]);
        if (!metricsRes.ok) throw new Error(`metrics HTTP ${metricsRes.status}`);

        const payload = await metricsRes.json();
        const days = payload.days || [];
        const latest = days[days.length - 1] || {};

        updateSummary(latest, payload);
        updateCharts(days);
        updateTable(days);

        let statusPayload = null;
        if (statusRes.ok) {
          try { statusPayload = await statusRes.json(); } catch {}
        }
        let signalsPayload = null;
        if (signalsRes.ok) {
          try { signalsPayload = await signalsRes.json(); } catch {}
        }
        updateHealth(statusPayload, signalsPayload);
        updateSignals(signalsPayload);

        status.textContent = `Updated ${now.toLocaleString()} • Window: ${payload.window_days} days`;
      } catch (e) {
        error.textContent = `Failed to load dashboard: ${e.message}`;
        error.style.display = 'block';
        status.textContent = `Error at ${now.toLocaleString()}`;
      }
    }

    function visibilityAwareTick() {
      if (document.visibilityState === 'hidden') return;
      load();
    }

    document.getElementById('refresh').addEventListener('click', load);
    init();
    load();
    setInterval(visibilityAwareTick, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
